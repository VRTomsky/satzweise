# Baut bei jedem Push auf main die Android-App und stellt sie als GitHub-Release bereit.
# Download aufs Handy: https://github.com/VRTomsky/satzweise/releases/latest/download/Satzweise.apk
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test
      # Webteil für die App bauen (relativer Pfad, ohne Service Worker) und ins Android-Projekt kopieren
      - run: npm run build:app
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Satzweise.apk
          gh release create "app-${{ github.run_number }}" Satzweise.apk \
            --title "Satzweise App 1.0.${{ github.run_number }}" \
            --notes "Android-App, gebaut aus ${{ github.sha }}. Auf dem Handy herunterladen und installieren." \
            --latest
